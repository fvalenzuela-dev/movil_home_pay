name: Central Validation

on:
  push:
    branches-ignore:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  verificar_version:
    name: Control de Versiones
    needs: [continuous_docs]
    uses: fvalenzuela-dev/.github/.github/workflows/version-check-new.yml@main
    with:
      version_file: "pubspec.yaml"
      base_branch: "main"
    secrets:
      GITHUB_TOKEN_CUSTOM: ${{ secrets.GITHUB_TOKEN }}

  continuous_docs:
    name: 📚 Continuous Documentation
    permissions:
      contents: write
      pull-requests: write
    uses: fvalenzuela-dev/.github/.github/workflows/continuous-docs.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number || '' }}
      pr_title: ${{ github.event.pull_request.title || '' }}
      pr_author: ${{ github.event.pull_request.user.login || '' }}
      base_ref: ${{ github.event.pull_request.base.ref || '' }}
      head_ref: ${{ github.event.pull_request.head.ref || '' }}
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    if: github.event_name == 'pull_request'

  build_and_test:
    name: Build & Test
    needs: [continuous_docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Fix coverage path
        run: |
          mkdir -p coverage
          if [ -f ".dart_tool/coverage/lcov.info" ]; then
            cp .dart_tool/coverage/lcov.info coverage/lcov.info
          fi
          ls -la coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 1

  codacy_coverage:
    name: Codacy Coverage
    needs: [build_and_test]
    uses: fvalenzuela-dev/.github/.github/workflows/codacy-coverage.yml@main
    with:
      coverage_report_path: "coverage/lcov.info"
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
