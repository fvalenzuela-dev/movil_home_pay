name: 📚 Continuous Documentation

on:
  push:
    branches:
      - develop

jobs:
  docs:
    permissions:
      contents: write
      pull-requests: write
    uses: fvalenzuela-dev/.github/.github/workflows/continuous-docs.yml@main
    with:
      pr_number: ''
      pr_title: ''
      pr_author: ''
      base_ref: develop
      head_ref: ''
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
